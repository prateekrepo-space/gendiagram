name: Deploy Dgen to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

permissions:
  id-token: write
  contents: read

jobs:
  # ── Deploy infrastructure + frontend via CDK ─────────────────────────────────
  deploy-infra:
    name: CDK Deploy (Infra + Frontend Image)
    runs-on: ubuntu-latest
    outputs:
      ec2_instance_id: ${{ steps.get_instance.outputs.instance_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK + infra deps
        run: |
          npm install -g aws-cdk ts-node typescript
          cd infra && npm ci

      - name: CDK Bootstrap (idempotent)
        run: cd infra && cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/ap-south-1 --require-approval never

      - name: CDK Deploy
        run: cd infra && cdk deploy DgenStack --require-approval never --outputs-file outputs.json

      - name: Get EC2 instance ID from ASG
        id: get_instance
        run: |
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names $(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?contains(Tags[?Key=='aws:cloudformation:stack-name'].Value, 'DgenStack')].AutoScalingGroupName" \
              --output text) \
            --query "AutoScalingGroups[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

  # ── Update backend on EC2 via SSM ────────────────────────────────────────────
  deploy-backend:
    name: Update Backend on EC2
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy backend via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ needs.deploy-infra.outputs.ec2_instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /app && git pull --ff-only",
              "cd /app/server && npm install --omit=dev",
              "pm2 reload server --update-env",
              "pm2 save"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.deploy-infra.outputs.ec2_instance_id }}"

          # Show output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.deploy-infra.outputs.ec2_instance_id }}" \
            --query "{Status:Status, Output:StandardOutputContent}" \
            --output json
